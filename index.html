<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My beloved woman</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
<section id="Stage1" class="Stage StageVisible" aria-label="Intro stage">
  <div class="BlurOverlay"></div>
  <div class="NoiseOverlay"></div>
  <div class="AmbientLight AmbientLight1"></div>
  <div class="AmbientLight AmbientLight2"></div>
  <div class="AmbientLight AmbientLight3"></div>

  <button id="OpenButton" class="OpenButton" type="button" aria-label="Open the site">
    Open?
  </button>
</section>

<section id="Stage2" class="Stage StageHidden" aria-hidden="true">
  <div class="Stage2Overlay"></div>

  <button id="EnvelopeButton" class="EnvelopeButton" type="button" aria-label="Open the envelope">
    <img
      id="EnvelopeSprite"
      class="EnvelopeSprite"
      src="assets/images/envelope-closed.png"
      alt="Closed envelope"
      draggable="false"
    />
  </button>

  <div id="StageHint" class="StageHint">Tap to open</div>
</section>

<section id="Stage4" class="Stage StageHidden" aria-hidden="true">
  <div class="Stage4Backdrop"></div>

  <div class="Stage4Slides">
    <article class="Stage4Slide Stage4SlideActive" data-slide="0">
      <div class="Stage4Card">
        <div class="Stage4Label">01</div>
        <h2 class="Stage4Title">Вместе мы уже</h2>

        <div class="Stage4Counter">
          <div><span id="DaysCount">0</span> дней</div>
          <div><span id="MinutesCount">0</span> минут</div>
          <div><span id="SecondsCount">0</span> секунд</div>
        </div>

        <p class="Stage4Text">
          Самое лучшее время в моей жизни, это время проведенное с тобой
        </p>
      </div>
    </article>

    <article class="Stage4Slide" data-slide="1">
      <div class="Stage4Card">
        <div class="Stage4Label">02</div>
        <h2 class="Stage4Title">Ты была моей первой мыслью</h2>

        <div class="Stage4Counter Stage4CounterTwo">
          <div><span id="MorningThoughtsCount">0</span> утра</div>
          <div><span id="NightThoughtsCount">0</span> перед сном</div>
        </div>

        <p class="Stage4Text">
          Давая мне мотивацию двигаться дальше 
        </p>
      </div>
    </article>

    <article class="Stage4Slide" data-slide="2">
      <div class="Stage4Card">
        <div class="Stage4Label">03</div>
        <h2 class="Stage4Title">Когда я думаю о тебе</h2>

        <div class="Stage4Tracks">
          <button class="Stage4TrackButton" type="button" data-track="0">
            <img src="assets/images/track-1.jpg" alt="Track 1" />
          </button>

          <button class="Stage4TrackButton" type="button" data-track="1">
            <img src="assets/images/track-2.jpg" alt="Track 2" />
          </button>

          <button class="Stage4TrackButton" type="button" data-track="2">
            <img src="assets/images/track-3.jpg" alt="Track 3" />
          </button>
        </div>

        <p class="Stage4Text">
          В голову, мне сразу приходят эти треки
        </p>
      </div>
    </article>
  </div>

  <div class="Stage4Hint">Tap to continue</div>

  <audio id="RomanticAudio" loop preload="auto">
    <source src="assets/audio/romantic-bg.mp3" type="audio/mpeg" />
  </audio>
<!-- 
  <audio id="TrackAudio" preload="auto">
    <source src="" type="audio/mpeg" />
  </audio> -->
</section>

<script src="js/main.js"></script>
<script src="js/stage2.js"></script>
<script src="js/stage4.js"></script>
</body>
</html>
